name: DNS9 autonomous Windows collector source

on:
  pull_request:
    paths:
      - 'collectors/windows/dns/Install-PhpIpamDnsCollector.ps1'
      - 'collectors/windows/dns/Invoke-PhpIpamDnsCollectorScheduled.ps1'
      - 'collectors/windows/dns/Get-PhpIpamDnsCollectorStatus.ps1'
      - 'collectors/windows/dns/Uninstall-PhpIpamDnsCollector.ps1'
      - 'tests/dns9/**'
      - 'design/DNS9_AUTONOMOUS_WINDOWS_COLLECTOR.md'
      - '.github/workflows/dns9-autonomous-collector.yml'

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 tests/dns9/autonomous-source.test.py

  windows-powershell-51:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Parse DNS9 PowerShell sources
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files=@(
            'collectors/windows/dns/Install-PhpIpamDnsCollector.ps1',
            'collectors/windows/dns/Invoke-PhpIpamDnsCollectorScheduled.ps1',
            'collectors/windows/dns/Get-PhpIpamDnsCollectorStatus.ps1',
            'collectors/windows/dns/Uninstall-PhpIpamDnsCollector.ps1'
          )
          foreach($file in $files){
            $tokens=$null
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)
            if(@($errors).Count -ne 0){
              $errors | Format-List * | Out-String | Write-Error
              throw "PowerShell parse failed: $file"
            }
          }
          Write-Output 'DNS9_WINDOWS_PARSE_OK=1'
