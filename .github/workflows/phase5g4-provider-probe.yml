name: Phase 5G Bounded Provider Diagnosis
on:
  push:
    branches: ['phase5g/**']
  pull_request:
    paths: ['tools/phase5g4-provider-probe.*', 'tests/phase5g4-provider-*', '.github/workflows/phase5g4-provider-probe.yml']
permissions:
  contents: read
jobs:
  provider-probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, sodium
          coverage: none
      - run: |
          php -r 'if (!class_exists("DOMDocument")) exit(1);'
          php -l tools/phase5g4-provider-probe.php
          php tests/phase5g4-provider-probe.test.php
          python3 -B tests/phase5g4-provider-launch.test.py
