name: Phase 5H9 Disabled Route Candidate
on:
  push:
    branches: ['phase5h9/**']
  pull_request:
    paths:
      - 'layers/phase5g2/app/integrations/vmware/mirror/native.php'
      - 'layers/phase5h9/**'
      - 'tools/build-phase5h9-runtime.py'
      - 'tests/phase5h9-*'
      - 'design/PHASE5H9_DISABLED_ROUTE_CANDIDATE.md'
      - '.github/workflows/phase5h9-disabled-route.yml'
permissions:
  contents: read
jobs:
  disabled-route:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate secure disabled route candidate
        run: |
          set -euo pipefail
          php -l layers/phase5h9/functions/classes/class.IntegrationVmwareFastReaderConfigLoader.php
          php -l layers/phase5g2/app/integrations/vmware/mirror/native.php
          php -l tests/phase5h9-config-loader.test.php
          php -l tests/phase5h9-disabled-route-selection.test.php
          python3 -m py_compile tools/build-phase5h9-runtime.py tests/phase5h9-config-loader-boundary.test.py tests/phase5h9-native-route-parity.test.py tests/phase5h9-runtime-package.test.py
          php tests/phase5h9-config-loader.test.php
          php tests/phase5h9-disabled-route-selection.test.php
          python3 -B tests/phase5h9-config-loader-boundary.test.py
          python3 -B tests/phase5h9-native-route-parity.test.py
          python3 -B tests/phase5h9-runtime-package.test.py
