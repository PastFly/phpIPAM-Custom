name: Phase 5H Fast-domain Publication
on:
  push:
    branches: ['phase5h/**']
  pull_request:
    paths:
      - 'layers/phase5h2/**'
      - 'tests/phase5h2-*'
      - '.github/workflows/phase5h2-fast-publication.yml'
      - 'design/PHASE5H2_FAST_PUBLICATION.md'
permissions:
  contents: read
jobs:
  fast-domain:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, sodium, posix
          coverage: none
      - name: Fast publication semantics and retained batch/runtime checks
        run: |
          set -euo pipefail
          php -l layers/phase5h2/functions/classes/class.IntegrationVmwareFastDomain.php
          php -l layers/phase5h2/functions/classes/class.IntegrationVmwareRosterReconciler.php
          php tests/phase5h2-fast-domain.test.php
          php tests/phase5h2-roster.test.php
          php -d memory_limit=256M tests/phase5h-batch.test.php
          php tests/phase5g-inventory.test.php
          php tests/phase5g3-telemetry.test.php
          python3 -B tests/phase5g2-contracts.test.py
