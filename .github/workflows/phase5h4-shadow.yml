name: Phase 5H Shadow Planning
on:
  push:
    branches: ['phase5h/**']
  pull_request:
    paths:
      - 'layers/phase5h/**'
      - 'layers/phase5h2/**'
      - 'layers/phase5h3/**'
      - 'layers/phase5h4/**'
      - 'tools/phase5h4-shadow-run.php'
      - 'tools/install-phase5h4-shadow.py'
      - 'tools/live/phase5h-stale-mor-rebench.sh'
      - 'tools/live/phase5h-selected-counter-rebench.sh'
      - 'tools/live/phase5h5-freshness-capability-hotfix.sh'
      - 'tools/live/phase5h5-freshness-v3-hotfix.sh'
      - 'tools/live/phase5h5-freshness-v4-hotfix.sh'
      - 'tools/live/phase5h5-steady-state-accept.sh'
      - 'tools/live/phase5h5-v3-steady-accept.sh'
      - 'tools/live/phase5h5-v4-steady-accept.sh'
      - 'tests/phase5h-*'
      - '.github/workflows/phase5h4-shadow.yml'
      - 'design/PHASE5H4_SHADOW_CYCLE.md'
permissions:
  contents: read
jobs:
  shadow:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, sodium, posix
          coverage: none
      - name: Shadow planning, stale MOR policy, freshness policy, selected counter policy and live launchers
        run: |
          set -euo pipefail
          php -l layers/phase5h2/functions/classes/class.IntegrationVmwareFastDomain.php
          php -l layers/phase5h4/functions/classes/class.IntegrationVmwareShadowPlanner.php
          php -l layers/phase5h4/functions/classes/class.IntegrationVmwareShadowCycle.php
          php -l tools/phase5h4-shadow-run.php
          bash -n tools/live/phase5h-stale-mor-rebench.sh
          bash -n tools/live/phase5h-selected-counter-rebench.sh
          bash -n tools/live/phase5h5-freshness-capability-hotfix.sh
          bash -n tools/live/phase5h5-freshness-v3-hotfix.sh
          bash -n tools/live/phase5h5-freshness-v4-hotfix.sh
          bash -n tools/live/phase5h5-steady-state-accept.sh
          bash -n tools/live/phase5h5-v3-steady-accept.sh
          bash -n tools/live/phase5h5-v4-steady-accept.sh
          python3 - <<'PY'
          import re
          from pathlib import Path
          compile(Path('tools/install-phase5h4-shadow.py').read_text(), 'tools/install-phase5h4-shadow.py', 'exec')
          stale=Path('tools/live/phase5h-stale-mor-rebench.sh').read_text()
          for required in ['PHASE5H_STALE_MOR_PATCH_OK=1', 'flock -x -w 600 9', 'PHASE5H_STALE_MOR_REBENCH_SOURCE=', 'vmware-fast-shadow-stale-mor-']:
              assert required in stale, required
          selected=Path('tools/live/phase5h-selected-counter-rebench.sh').read_text()
          for required in ['PHASE5H_SELECTED_COUNTER_PATCH_OK=1', 'flock -x -w 600 9', 'PHASE5H_SELECTED_COUNTER_REBENCH_SOURCE=', "NEW_PERF='b35127f8e28e503f558a08327b73cf9c6d41002a'"]:
              assert required in selected, required
          freshness=Path('tools/live/phase5h5-freshness-capability-hotfix.sh').read_text()
          for required in [
              "BEHAVIOR='29ef45598b075ba82897e0491a3cbb78b1b65093'",
              "V1_FAST='366ce1d6a702c91a3556d3a2a969ff9993aad1d4'",
              "NEW_FAST='48279e71f7621e249435d47396c09e765e664340'",
              "NEW_PLANNER='898d9bf64cfe328dc2243fc938b1c709e234c486'",
              "NEW_CYCLE='9064e26f6d76f6e09ee7e615f2ae7e5c2506e129'",
              'PHASE5H5_FRESHNESS_V2_LOCAL_TESTS_OK=1','PHASE5H5_FRESHNESS_V2_PATCH_OK=1',
              'PHASE5H5_FRESHNESS_V2_STATE=',
              "LOCK='/var/lib/phpipam-custom/vmware-inventory-recovery5g5/connector-1/worker.lock'",
              'while ! flock -x -n 9','PHASE5H5_FRESHNESS_V2_WEBSITE_CHANGED=0','PHASE5H5_FRESHNESS_V2_SYSTEMD_CHANGED=0'
          ]:
              assert required in freshness, required
          v3=Path('tools/live/phase5h5-freshness-v3-hotfix.sh').read_text()
          for required in [
              "BEHAVIOR='553c51667b130b0b3def3f07e0567470cadfea96'",
              "OLD_FAST='48279e71f7621e249435d47396c09e765e664340'",
              "NEW_FAST='3d6b29d233bca8ccb1edc7a5bcc3fb2710c42ed6'",
              "EXPECTED_PLANNER='898d9bf64cfe328dc2243fc938b1c709e234c486'",
              "EXPECTED_CYCLE='9064e26f6d76f6e09ee7e615f2ae7e5c2506e129'",
              'PHASE5H5_FRESHNESS_V3_LOCAL_TESTS_OK=1','PHASE5H5_FRESHNESS_V3_PATCH_OK=1',
              'PHASE5H5_FRESHNESS_V3_WEBSITE_CHANGED=0','PHASE5H5_FRESHNESS_V3_SYSTEMD_CHANGED=0'
          ]:
              assert required in v3, required
          v4=Path('tools/live/phase5h5-freshness-v4-hotfix.sh').read_text()
          for required in [
              "BEHAVIOR='9a628539680cbe3dd36a9474c6bac17f36c92856'",
              "OLD_FAST='3d6b29d233bca8ccb1edc7a5bcc3fb2710c42ed6'",
              "NEW_FAST='5c95cd68601a6175d9127aae980d492316c03dc9'",
              "EXPECTED_PLANNER='898d9bf64cfe328dc2243fc938b1c709e234c486'",
              "EXPECTED_CYCLE='9064e26f6d76f6e09ee7e615f2ae7e5c2506e129'",
              'PHASE5H5_FRESHNESS_V4_LOCAL_TESTS_OK=1','PHASE5H5_FRESHNESS_V4_PATCH_OK=1',
              'PHASE5H5_FRESHNESS_V4_WEBSITE_CHANGED=0','PHASE5H5_FRESHNESS_V4_SYSTEMD_CHANGED=0'
          ]:
              assert required in v4, required
          steady=Path('tools/live/phase5h5-steady-state-accept.sh').read_text()
          for required in [
              "FAST_BLOB='48279e71f7621e249435d47396c09e765e664340'",
              "PLANNER_BLOB='898d9bf64cfe328dc2243fc938b1c709e234c486'",
              "CYCLE_BLOB='9064e26f6d76f6e09ee7e615f2ae7e5c2506e129'",
              'MAX_CYCLES=7','STEADY_REQUIRED=3','INTERVAL=60','LOCK_WAIT_LIMIT=180',
              'PHASE5H5_STEADY_CONSECUTIVE_COUNT=', 'PHASE5H5_STEADY_ACCEPTANCE=',
              'PHASE5H5_STEADY_EXPECTS_NEW_SHADOW_CYCLE=1',
              'target_60_300_acceptance','PHASE5H5_STEADY_SHADOW_ACCEPT_OK=1',
              'PHASE5H5_STEADY_WEBSITE_CHANGED=0','PHASE5H5_STEADY_SYSTEMD_CHANGED=0'
          ]:
              assert required in steady, required
          v3steady=Path('tools/live/phase5h5-v3-steady-accept.sh').read_text()
          for required in [
              "OLD_FAST='48279e71f7621e249435d47396c09e765e664340'",
              "NEW_FAST='3d6b29d233bca8ccb1edc7a5bcc3fb2710c42ed6'",
              'PHASE5H5_V3_STEADY_WRAPPER_OK=1',
              'PHASE5H5_V3_STEADY_EXPECTS_UNSUPPORTED_SERIES_DEMOTION=1'
          ]:
              assert required in v3steady, required
          v4steady=Path('tools/live/phase5h5-v4-steady-accept.sh').read_text()
          for required in [
              "OLD_FAST='48279e71f7621e249435d47396c09e765e664340'",
              "NEW_FAST='5c95cd68601a6175d9127aae980d492316c03dc9'",
              'PHASE5H5_V4_STEADY_WRAPPER_OK=1',
              'PHASE5H5_V4_STEADY_EXPECTS_OMITTED_SERIES_STALE=1'
          ]:
              assert required in v4steady, required
          unsafe_local=re.compile(r'^\s*local\s+[^\n]*\b([A-Za-z_][A-Za-z0-9_]*)="[^\n]*"[^\n]*\$\1', re.M)
          for name,text in [('freshness',freshness),('v3',v3),('v4',v4),('steady',steady),('v3steady',v3steady),('v4steady',v4steady)]:
              assert unsafe_local.search(text) is None, f'unsafe_set_u_local:{name}'
          for forbidden in ['systemctl stop', 'systemctl disable', 'systemctl enable', 'base64']:
              for text in [stale,selected,freshness,v3,v4,steady,v3steady,v4steady]:
                  assert forbidden not in text, forbidden
          PY
          php tests/phase5h4-shadow-planner.test.php
          php tests/phase5h4-shadow-cycle.test.php
          php tests/phase5h-stale-mor.test.php
          sudo python3 -B tests/phase5h4-shadow-installer.test.py
          php tests/phase5h2-fast-domain.test.php
          php tests/phase5h2-roster.test.php
          php tests/phase5h3-fast-store.test.php
          php -d memory_limit=256M tests/phase5h-batch.test.php
          php tests/phase5h-counter-registry-duplicate.test.php
          php tests/phase5g-inventory.test.php
          php tests/phase5g3-telemetry.test.php
          python3 -B tests/phase5g2-contracts.test.py
