name: Phase 5H Shadow Planning
on:
  push:
    branches: ['phase5h/**']
  pull_request:
    paths:
      - 'layers/phase5h/**'
      - 'layers/phase5h2/**'
      - 'layers/phase5h3/**'
      - 'layers/phase5h4/**'
      - 'tools/phase5h4-shadow-run.php'
      - 'tools/install-phase5h4-shadow.py'
      - 'tests/phase5h-*'
      - '.github/workflows/phase5h4-shadow.yml'
      - 'design/PHASE5H4_SHADOW_CYCLE.md'
permissions:
  contents: read
jobs:
  shadow:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, sodium, posix
          coverage: none
      - name: Shadow planning, stale MOR policy, encrypted publication and retained collectors
        run: |
          set -euo pipefail
          php -l layers/phase5h4/functions/classes/class.IntegrationVmwareShadowPlanner.php
          php -l layers/phase5h4/functions/classes/class.IntegrationVmwareShadowCycle.php
          php -l tools/phase5h4-shadow-run.php
          python3 - <<'PY'
          from pathlib import Path
          compile(Path('tools/install-phase5h4-shadow.py').read_text(), 'tools/install-phase5h4-shadow.py', 'exec')
          PY
          php tests/phase5h4-shadow-planner.test.php
          php tests/phase5h4-shadow-cycle.test.php
          php tests/phase5h-stale-mor.test.php
          sudo python3 -B tests/phase5h4-shadow-installer.test.py
          php tests/phase5h2-fast-domain.test.php
          php tests/phase5h2-roster.test.php
          php tests/phase5h3-fast-store.test.php
          php -d memory_limit=256M tests/phase5h-batch.test.php
          php tests/phase5g-inventory.test.php
          php tests/phase5g3-telemetry.test.php
          python3 -B tests/phase5g2-contracts.test.py
