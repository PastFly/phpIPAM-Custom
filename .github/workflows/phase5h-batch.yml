name: Phase 5H Batched Read-only Collection
on:
  push:
    branches: ['phase5h/**']
  pull_request:
    paths: ['layers/phase5h/**', 'tests/phase5h-*', '.github/workflows/phase5h-batch.yml', 'design/PHASE5H_BATCH_COLLECTION.md']
permissions:
  contents: read
jobs:
  batch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, sodium, posix, pcntl, curl, mbstring
          coverage: none
      - name: SOAP batching, fault handling, session scope and full-scale fixtures
        run: |
          set -euo pipefail
          php -r 'if (!class_exists("DOMDocument")) exit(1);'
          php -d memory_limit=256M tests/phase5h-batch.test.php
          python3 -B tests/phase5h-boundary.test.py
      - name: Retained encrypted state, metrics and installed runtime contracts
        run: |
          set -euo pipefail
          php tests/phase5g-inventory.test.php
          php tests/phase5g3-telemetry.test.php
          python3 -B tests/phase5g5-runtime-package.test.py
          python3 -B tests/phase5g2-contracts.test.py
