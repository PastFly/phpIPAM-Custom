name: Phase 5H.5 Recurring Shadow Acceptance
on:
  push:
    branches: ['phase5h/**']
  pull_request:
    paths:
      - 'tools/phase5h5-shadow-inspect.php'
      - 'tools/live/phase5h5-recurring-shadow-accept.sh'
      - '.github/workflows/phase5h5-recurring-shadow-acceptance.yml'
permissions:
  contents: read
jobs:
  acceptance-boundary:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2','8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, posix, dom
          coverage: none
      - name: Syntax and non-serving recurring boundary
        run: |
          set -euo pipefail
          php -l tools/phase5h5-shadow-inspect.php
          bash -n tools/live/phase5h5-recurring-shadow-accept.sh
          bash -u -c 'SHADOW=/tmp; f(){ local rel="$1" expected="$2"; local path="$SHADOW/$rel"; test "$path" = /tmp/example && test "$expected" = deadbeef; }; f example deadbeef'
          python3 - <<'PY'
          from pathlib import Path
          inspect=Path('tools/phase5h5-shadow-inspect.php').read_text()
          live=Path('tools/live/phase5h5-recurring-shadow-accept.sh').read_text()
          for required in [
              "SOURCE='da2e4d10534044023dc3acd073fc37ead50741a8'",
              "INSPECT_BLOB='ce31b97df4422fde2cfd64e154ae61ab9d2da592'",
              "LOCK='/var/lib/phpipam-custom/vmware-inventory-recovery5g5/connector-1/worker.lock'",
              'CYCLES=3','INTERVAL=60','LOCK_WAIT_LIMIT=180',
              'while ! flock -x -n 9','LOCK_WAIT_SECONDS=',
              'local rel="$1" expected="$2"\n    local path="$SHADOW/$rel"',
              'phase5h4-shadow-run.php','PHASE5H5_RECURRING_ACCEPTANCE=',
              'target_60_300_acceptance','PHASE5H5_RECURRING_SHADOW_ACCEPT_OK=1',
              'PHASE5H5_RECURRING_WEBSITE_CHANGED=0','PHASE5H5_RECURRING_SYSTEMD_CHANGED=0'
          ]:
              assert required in live, required
          for forbidden in [
              'systemctl stop','systemctl disable','systemctl enable','base64','flock -x -w 180 9',
              'local rel="$1" expected="$2" path="$SHADOW/$rel"'
          ]:
              assert forbidden not in live, forbidden
          for required in [
              'PHASE5H5_SHADOW_INSPECT=', 'shadow_read_only_inspection',
              'fresh_series_observed_to_visible_seconds','source_completed_to_visible_seconds',
              "website_served_from_shadow'=>false"
          ]:
              assert required in inspect, required
          for forbidden in ['->write(', '->publish(', '->update(', 'ShadowCycle::run', 'workerRuntime(', 'curl_init(', 'system(']:
              assert forbidden not in inspect, forbidden
          print('PHASE5H5_RECURRING_NON_SERVING_BOUNDARY_OK')
          PY
