name: Phase 5F.3.1 VMware VM Network Path

on:
  push:
    branches: ["phase5f31/vm-network-path"]
  pull_request:
    branches: ["phase5f3/vmware-host-network-hints"]

jobs:
  phase5f31:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax
        run: |
          php -l layers/phase5f31/functions/classes/class.IntegrationVmwareVcenterVmNetworkPath.php
          php -l layers/phase5f31/app/integrations/vmware/vm-network-path-result.php
          php -l tools/live-vmware-phase5f31-vm-network-path-preview.php
          node --check layers/phase5f31/app/integrations/vmware/phase5f31-vm-network-path.js
          bash -n tools/live-vmware-phase5f31-ui-preflight.sh
          bash -n installer/verify-vmware-vcenter-phase5f31-vm-network-path.sh
          bash -n installer/install-vmware-vcenter-phase5f31-vm-network-path.sh

      - name: Mapping regression
        run: php tests/phase5f31-vm-network-path-regression.php

      - name: Enforce Phase 5F.3 baseline
        run: |
          test -f installer/verify-vmware-vcenter-phase5f3-host-network.sh
          grep -Fq 'PHASE5F3_HOST_NETWORK_VERIFY_OK' installer/verify-vmware-vcenter-phase5f3-host-network.sh
          grep -Fq 'verify-vmware-vcenter-phase5f3-host-network.sh' tools/live-vmware-phase5f31-ui-preflight.sh
          grep -Fq 'verify-vmware-vcenter-phase5f3-host-network.sh' installer/verify-vmware-vcenter-phase5f31-vm-network-path.sh
          grep -Fq 'PHASE5F31_BASE_PHASE5F3_OK=1' tools/live-vmware-phase5f31-ui-preflight.sh

      - name: Enforce exact runtime blobs
        run: |
          test "$(git hash-object layers/phase5f31/functions/classes/class.IntegrationVmwareVcenterVmNetworkPath.php)" = "987b03a66acd8023d1010cc20167cf1da60791d4"
          test "$(git hash-object layers/phase5f31/app/integrations/vmware/vm-network-path-result.php)" = "c483e943d1a02037422fbeded2e5217e1d71041a"
          test "$(git hash-object layers/phase5f31/app/integrations/vmware/phase5f31-vm-network-path.js)" = "08cc549fa138abb75ab440d4d1bb12bec75cbece"
          test "$(git hash-object layers/phase5f31/app/integrations/vmware/phase5f31-vm-network-path.css)" = "0726fc928342a73bb344929f744cb0e4735d1040"

      - name: Enforce bounded read-only property surface
        run: |
          CLASS=layers/phase5f31/functions/classes/class.IntegrationVmwareVcenterVmNetworkPath.php
          grep -Fq '<type>VirtualMachine</type><pathSet>runtime.host</pathSet>' "$CLASS"
          grep -Fq '<pathSet>configManager.networkSystem</pathSet><pathSet>config.network</pathSet>' "$CLASS"
          grep -Fq '<QueryNetworkHint xmlns="urn:vim25">' "$CLASS"
          grep -Fq "'property_method' => 'RetrieveProperties'" "$CLASS"
          grep -Fq "'hint_method' => 'QueryNetworkHint'" "$CLASS"
          grep -Fq "'persistent_inventory_written' => false" "$CLASS"
          grep -Fq "'phpipam_objects_modified' => false" "$CLASS"
          grep -Fq "'vcenter_objects_modified' => false" "$CLASS"
          ! grep -Eq '<(Update|Add|Remove|Destroy|Reconfig|Power|Migrate|Relocate|RefreshNetworkSystem)' "$CLASS"

      - name: Enforce direct no-proxy transport
        run: |
          CLASS=layers/phase5f31/functions/classes/class.IntegrationVmwareVcenterVmNetworkPath.php
          grep -Fq "CURLOPT_PROXY => ''" "$CLASS"
          grep -Fq 'CURLOPT_NOPROXY' "$CLASS"
          grep -Fq "'rest_transport' => 'direct_no_proxy'" "$CLASS"
          grep -Fq "'soap_transport' => 'direct_no_proxy'" "$CLASS"
          grep -Fq 'IntegrationVmwareVcenterDirectTransport' tools/live-vmware-phase5f31-vm-network-path-preview.php
          grep -Fq 'IntegrationVmwareVcenterFaultAwareTransport' tools/live-vmware-phase5f31-vm-network-path-preview.php

      - name: Enforce no fake current uplink
        run: |
          CLASS=layers/phase5f31/functions/classes/class.IntegrationVmwareVcenterVmNetworkPath.php
          grep -Fq "'current_uplink' => null" "$CLASS"
          grep -Fq "'current_uplink_proven' => false" "$CLASS"
          grep -Fq 'not_proven_by_available_read_only_properties' "$CLASS"
          grep -Fq 'PHASE5F31_PREVIEW_CURRENT_UPLINK_GUESSING=0' tools/live-vmware-phase5f31-vm-network-path-preview.php

      - name: Enforce UI fail-open and request ordering
        run: |
          ENDPOINT=layers/phase5f31/app/integrations/vmware/vm-network-path-result.php
          JS=layers/phase5f31/app/integrations/vmware/phase5f31-vm-network-path.js
          grep -Fq '$User->is_admin(false)' "$ENDPOINT"
          grep -Fq "csrf_cookie('validate', 'integration_vmware_vcenter_explorer'" "$ENDPOINT"
          grep -Fq 'Current uplink не заявляется' "$ENDPOINT"
          grep -Fq 'vm-network-path-result.php' "$JS"
          grep -Fq 'vm-card-result.php' "$JS"
          grep -Fq 'sequence' "$JS"
          grep -Fq 'Основная карточка VM не затронута' "$JS"

      - name: Enforce preview safety
        run: |
          PREVIEW=tools/live-vmware-phase5f31-vm-network-path-preview.php
          grep -Fq 'PHASE5F31_PREVIEW_PERSISTENCE=0' "$PREVIEW"
          grep -Fq 'PHASE5F31_PREVIEW_PHPIPAM_MUTATIONS=0' "$PREVIEW"
          grep -Fq 'PHASE5F31_PREVIEW_VCENTER_MUTATIONS=0' "$PREVIEW"
          grep -Fq 'PHASE5F31_PREVIEW_RESULT=READ_ONLY_COMPATIBILITY_OK' "$PREVIEW"
          grep -Fq -- '--vm-id is required; the preview never guesses a production VM.' "$PREVIEW"

      - name: Enforce deployment gate
        run: |
          grep -Fq 'PREFLIGHT_WRITE_OPERATIONS=0' tools/live-vmware-phase5f31-ui-preflight.sh
          grep -Fq 'PREFLIGHT_VCENTER_REQUESTS=0' tools/live-vmware-phase5f31-ui-preflight.sh
          grep -Fq 'READY_FOR_PHASE5F31_VM_NETWORK_PATH_OWNER_APPROVAL' tools/live-vmware-phase5f31-ui-preflight.sh
          grep -Fq 'PHASE5F31_VM_NETWORK_PATH_VERIFY_OK' installer/verify-vmware-vcenter-phase5f31-vm-network-path.sh
          grep -Fq 'PHASE5F31_VM_NETWORK_PATH_INSTALL_OK' installer/install-vmware-vcenter-phase5f31-vm-network-path.sh
