name: Phase 5F.3.4 Snapshot Cache Foundation
on:
  push:
    branches: [phase5f34/vmware-snapshot-cache]
  pull_request:
    branches: [phase5f332/vm-datastore-folders]
permissions:
  contents: read
jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: sodium, posix, pcntl
          coverage: none
      - name: Syntax and protected installed baseline
        run: |
          set -euo pipefail
          php -l layers/phase5f34/functions/classes/class.IntegrationVmwareSnapshotCache.php
          bash -n tools/live-vmware-phase5f34-cache-preflight.sh
          python3 -m py_compile tools/live-vmware-phase5f34-cache-preflight.py
          git diff --exit-code 9c40ef6029ebe0d9fb7bbea190fcaca16c67750f HEAD -- installer layers/phase5d layers/phase5e layers/phase5f layers/phase5f25 layers/phase5f26 layers/phase5f33 layers/phase5f331 layers/phase5f332
      - name: Encrypted snapshots, hard TTL, revocation, isolation, backoff and concurrent refresh
        run: php tests/phase5f34-cache.test.php
      - name: Environment survey has no write or key-read side effects
        run: PYTHONDONTWRITEBYTECODE=1 python3 tests/phase5f34-preflight.test.py
      - name: Arguments fail before runtime or network access
        run: |
          set +e
          PYTHONDONTWRITEBYTECODE=1 python3 tools/live-vmware-phase5f34-cache-preflight.py
          rc=$?
          test "$rc" -eq 2
      - name: Archive committed test sources only
        if: matrix.php == '8.2'
        run: |
          git archive --format=tar HEAD layers installer tools tests .github CACHE_DESIGN.md | gzip > "$RUNNER_TEMP/cache-test-sources.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/cache-source-commit.txt"
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.2'
        with:
          name: cache-test-sources
          path: |
            ${{ runner.temp }}/cache-test-sources.tar.gz
            ${{ runner.temp }}/cache-source-commit.txt
          retention-days: 1
