name: Phase 5F VMware Observability Regression

on:
  push:
    branches:
      - phase5f/vmware-observability
  pull_request:
    branches:
      - phase5e/vmware-explorer-ux
    paths:
      - 'layers/phase5f/**'
      - 'tools/live-vmware-phase5f-**'
      - 'installer/*phase5f*'
      - 'tests/vmware-vcenter-phase5f-*'
      - '.github/workflows/phase5f-vmware-observability.yml'

permissions:
  contents: read

jobs:
  phase5f-observability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PHP CLI/XML/cURL
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-curl php-xml

      - name: Validate syntax
        run: |
          php -l layers/phase5f/functions/classes/class.IntegrationVmwareVcenterDirectTransport.php
          php -l layers/phase5f/functions/classes/class.IntegrationVmwareVcenterFaultAwareTransport.php
          php -l layers/phase5f/functions/classes/class.IntegrationVmwareVcenterSoapHostResolver.php
          php -l layers/phase5f/functions/classes/class.IntegrationVmwareVcenterSoapReadOnly.php
          php -l layers/phase5f/functions/classes/class.IntegrationVmwareVcenterPerformance.php
          php -l layers/phase5f/app/integrations/vmware/host-card-result.php
          php -l layers/phase5f/app/integrations/vmware/performance-result.php
          node --check layers/phase5f/app/integrations/vmware/phase5f-observability.js
          php -l tests/vmware-vcenter-phase5f-fault-aware-transport-regression.php
          php -l tests/vmware-vcenter-phase5f-soap-host-resolver-regression.php
          php -l tests/vmware-vcenter-phase5f-soap-host-summary-regression.php
          php -l tests/vmware-vcenter-phase5f-performance-regression.php
          php -l tools/live-vmware-phase5f-observability-preview.php
          php -l tools/live-vmware-phase5f-transport-diagnostic.php
          bash -n tools/live-vmware-phase5f-ui-preflight.sh
          bash -n installer/install-vmware-vcenter-phase5f-ui.sh
          bash -n installer/verify-vmware-vcenter-phase5f-ui.sh

      - name: Run fault-aware transport regression
        run: php tests/vmware-vcenter-phase5f-fault-aware-transport-regression.php

      - name: Run SOAP host-resolver regression
        run: php tests/vmware-vcenter-phase5f-soap-host-resolver-regression.php

      - name: Run SOAP host-summary regression
        run: php tests/vmware-vcenter-phase5f-soap-host-summary-regression.php

      - name: Run PerformanceManager regression
        run: php tests/vmware-vcenter-phase5f-performance-regression.php

      - name: Enforce SOAP host resolver boundary
        run: |
          grep -Fq '<FindByDnsName xmlns="urn:vim25">' layers/phase5f/functions/classes/class.IntegrationVmwareVcenterSoapHostResolver.php
          grep -Fq '<vmSearch>false</vmSearch>' layers/phase5f/functions/classes/class.IntegrationVmwareVcenterSoapHostResolver.php
          grep -Fq "resolve_host_id_by_dns_name" tools/live-vmware-phase5f-observability-preview.php
          grep -Fq 'PHASE5F_PREVIEW_RESOLUTION=SOAP_SEARCH_INDEX_DNS' tools/live-vmware-phase5f-observability-preview.php
          if grep -Fq 'IntegrationVmwareVcenterTopology' tools/live-vmware-phase5f-observability-preview.php; then
            echo 'Phase 5F compatibility preview must not depend on REST topology authentication' >&2
            exit 1
          fi

      - name: Enforce compatible PropertyCollector reads
        run: |
          grep -Fq '<RetrieveProperties xmlns="urn:vim25">' layers/phase5f/functions/classes/class.IntegrationVmwareVcenterSoapReadOnly.php
          grep -Fq '<RetrieveProperties xmlns="urn:vim25">' layers/phase5f/functions/classes/class.IntegrationVmwareVcenterPerformance.php
          if grep -Fq '<RetrievePropertiesEx ' layers/phase5f/functions/classes/class.IntegrationVmwareVcenterSoapReadOnly.php; then
            echo 'Host summary regressed to RetrievePropertiesEx' >&2
            exit 1
          fi
          if grep -Fq '<RetrievePropertiesEx ' layers/phase5f/functions/classes/class.IntegrationVmwareVcenterPerformance.php; then
            echo 'Performance counter discovery regressed to RetrievePropertiesEx' >&2
            exit 1
          fi
          grep -Fq "'RetrieveProperties'" layers/phase5f/functions/classes/class.IntegrationVmwareVcenterFaultAwareTransport.php

      - name: Enforce direct no-proxy vCenter transport
        run: |
          grep -Fq "CURLOPT_PROXY => ''" layers/phase5f/functions/classes/class.IntegrationVmwareVcenterDirectTransport.php
          grep -Fq "CURLOPT_NOPROXY] = '*'" layers/phase5f/functions/classes/class.IntegrationVmwareVcenterDirectTransport.php
          grep -Fq 'IntegrationVmwareVcenterDirectTransport' tools/live-vmware-phase5f-observability-preview.php
          grep -Fq 'PHASE5F_PREVIEW_TRANSPORT=DIRECT_NO_PROXY' tools/live-vmware-phase5f-observability-preview.php
          grep -Fq 'IntegrationVmwareVcenterFaultAwareTransport($DirectTransport' tools/live-vmware-phase5f-observability-preview.php
          grep -Fq 'IntegrationVmwareVcenterSoapHostResolver($FaultAwareTransport' tools/live-vmware-phase5f-observability-preview.php
          grep -Fq 'IntegrationVmwareVcenterSoapReadOnly($FaultAwareTransport' tools/live-vmware-phase5f-observability-preview.php
          grep -Fq 'IntegrationVmwareVcenterPerformance($FaultAwareTransport' tools/live-vmware-phase5f-observability-preview.php
          if grep -Eqi '\b(GET|PUT|PATCH|DELETE)\b' layers/phase5f/functions/classes/class.IntegrationVmwareVcenterDirectTransport.php; then
            echo 'Direct Phase 5F SOAP transport exposes a non-POST method token' >&2
            exit 1
          fi

      - name: Enforce safe fault diagnostic boundary
        run: |
          grep -Fq 'faultstring' layers/phase5f/functions/classes/class.IntegrationVmwareVcenterFaultAwareTransport.php
          grep -Fq 'PHASE5F_PREVIEW_STAGE=HOST_RESOLVE' tools/live-vmware-phase5f-observability-preview.php
          grep -Fq 'PHASE5F_PREVIEW_STAGE=HOST_SUMMARY' tools/live-vmware-phase5f-observability-preview.php
          grep -Fq 'PHASE5F_PREVIEW_STAGE=HOST_PERFORMANCE' tools/live-vmware-phase5f-observability-preview.php
          if grep -Eq 'Cookie:|password>|userName>' layers/phase5f/functions/classes/class.IntegrationVmwareVcenterFaultAwareTransport.php; then
            echo 'Fault-aware transport must not contain credential/cookie rendering logic' >&2
            exit 1
          fi

      - name: Enforce transport diagnostic boundary
        run: |
          grep -Fq 'PHASE5F_DIAG_CREDENTIAL_SENT=0' tools/live-vmware-phase5f-transport-diagnostic.php
          grep -Fq '/sdk/vimService.wsdl' tools/live-vmware-phase5f-transport-diagnostic.php
          grep -Fq '<RetrieveServiceContent xmlns="urn:vim25">' tools/live-vmware-phase5f-transport-diagnostic.php
          grep -Fq "CURLOPT_PROXY] = ''" tools/live-vmware-phase5f-transport-diagnostic.php
          grep -Fq 'PROXY_INTERFERENCE_CONFIRMED' tools/live-vmware-phase5f-transport-diagnostic.php
          if grep -Fq 'load_runtime_config' tools/live-vmware-phase5f-transport-diagnostic.php; then
            echo 'Transport diagnostic must not decrypt saved VMware credentials' >&2
            exit 1
          fi
          if grep -Eqi '\b(Login|FindByDnsName|QueryPerf|RetrievePropertiesEx)\b' tools/live-vmware-phase5f-transport-diagnostic.php; then
            echo 'Transport diagnostic scope exceeded anonymous transport probing' >&2
            exit 1
          fi

      - name: Enforce dynamic counter discovery
        run: |
          grep -Fq '<pathSet>perfCounter</pathSet>' layers/phase5f/functions/classes/class.IntegrationVmwareVcenterPerformance.php
          grep -Fq "cpu.usage.average" layers/phase5f/functions/classes/class.IntegrationVmwareVcenterPerformance.php
          grep -Fq "mem.usage.average" layers/phase5f/functions/classes/class.IntegrationVmwareVcenterPerformance.php
          grep -Fq '<QueryPerfProviderSummary' layers/phase5f/functions/classes/class.IntegrationVmwareVcenterPerformance.php
          grep -Fq '<QueryAvailablePerfMetric' layers/phase5f/functions/classes/class.IntegrationVmwareVcenterPerformance.php
          grep -Fq '<QueryPerf ' layers/phase5f/functions/classes/class.IntegrationVmwareVcenterPerformance.php
          if grep -Eq "counterId[^\n]*(=|=>)[[:space:]]*[0-9]+" layers/phase5f/functions/classes/class.IntegrationVmwareVcenterPerformance.php; then
            echo 'Hardcoded numeric performance counter ID detected' >&2
            exit 1
          fi

      - name: Enforce observability UI boundary
        run: |
          grep -Fq 'PHPIPAM_CUSTOM_VMWARE_PHASE5F_HOST_CARD_V1' layers/phase5f/app/integrations/vmware/host-card-result.php
          grep -Fq 'PHPIPAM_CUSTOM_VMWARE_PHASE5F_VM_PERFORMANCE_V1' layers/phase5f/app/integrations/vmware/performance-result.php
          grep -Fq "preg_match('/^host-[0-9]+$/" layers/phase5f/app/integrations/vmware/host-card-result.php
          grep -Fq "preg_match('/^vm-[0-9]+$/" layers/phase5f/app/integrations/vmware/performance-result.php
          grep -Fq "csrf_cookie('validate', 'integration_vmware_vcenter_explorer'" layers/phase5f/app/integrations/vmware/host-card-result.php
          grep -Fq "csrf_cookie('validate', 'integration_vmware_vcenter_explorer'" layers/phase5f/app/integrations/vmware/performance-result.php
          grep -Fq 'host-card-result.php' layers/phase5f/app/integrations/vmware/phase5f-observability.js
          grep -Fq 'performance-result.php' layers/phase5f/app/integrations/vmware/phase5f-observability.js
          grep -Fq 'max_samples: 60' layers/phase5f/app/integrations/vmware/phase5f-observability.js
          grep -Fq 'persistent_inventory_written=false' layers/phase5f/app/integrations/vmware/host-card-result.php
          grep -Fq 'persistent_inventory_written=false' layers/phase5f/app/integrations/vmware/performance-result.php
          if grep -Eqi '\b(INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|TRUNCATE)[[:space:]]' layers/phase5f/app/integrations/vmware; then
            echo 'SQL mutation verb in Phase 5F UI layer' >&2
            exit 1
          fi

      - name: Enforce live UI deployment gate
        run: |
          grep -Fq 'PREFLIGHT_RESULT=READY_FOR_PHASE5F_UI_OWNER_APPROVAL' tools/live-vmware-phase5f-ui-preflight.sh
          grep -Fq 'PREFLIGHT_WRITE_OPERATIONS=0' tools/live-vmware-phase5f-ui-preflight.sh
          grep -Fq 'PREFLIGHT_VCENTER_REQUESTS=0' tools/live-vmware-phase5f-ui-preflight.sh
          grep -Fq 'PHASE5F_UI_VERIFY_OK' installer/verify-vmware-vcenter-phase5f-ui.sh
          grep -Fq 'PHASE5F_UI_INSTALL_OK' installer/install-vmware-vcenter-phase5f-ui.sh
          grep -Fq 'PHASE5F_UI_ROLLBACK_OK' installer/install-vmware-vcenter-phase5f-ui.sh
          grep -Fq 'PHPIPAM_CUSTOM_VMWARE_PHASE5F_OBSERVABILITY_UI_V1' installer/install-vmware-vcenter-phase5f-ui.sh
          grep -Fq 'verify-vmware-vcenter-phase5e2-ip-style.sh' tools/live-vmware-phase5f-ui-preflight.sh

      - name: Enforce live preview safety contract
        run: |
          grep -Fq 'IntegrationVmwareVcenter();' tools/live-vmware-phase5f-observability-preview.php
          grep -Fq 'normalize_endpoint($runtime' tools/live-vmware-phase5f-observability-preview.php
          grep -Fq 'PHASE5F_PREVIEW_PERSISTENCE=0' tools/live-vmware-phase5f-observability-preview.php
          grep -Fq 'PHASE5F_PREVIEW_VCENTER_MUTATIONS=0' tools/live-vmware-phase5f-observability-preview.php
          grep -Fq -- '--host-name is required; the preview never guesses a production Host' tools/live-vmware-phase5f-observability-preview.php
          grep -Fq 'max-samples must be between 2 and 60 for the live preview' tools/live-vmware-phase5f-observability-preview.php
          if grep -Eqi '\b(INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|TRUNCATE)[[:space:]]' tools/live-vmware-phase5f-observability-preview.php tools/live-vmware-phase5f-transport-diagnostic.php; then
            echo 'SQL mutation verb in Phase 5F live tooling' >&2
            exit 1
          fi

      - name: Enforce read-only source boundary
        run: |
          if grep -REni '\b(ReconfigVM_Task|PowerOnVM_Task|PowerOffVM_Task|ResetVM_Task|ShutdownGuest|RebootGuest|EnterMaintenanceMode_Task|ExitMaintenanceMode_Task|Destroy_Task|CreateVM_Task|RelocateVM_Task|MigrateVM_Task|UpdateOptions|UpdateConfig|CreatePerfInterval|RemovePerfInterval|UpdatePerfInterval)\b' layers/phase5f tools/live-vmware-phase5f-observability-preview.php tools/live-vmware-phase5f-transport-diagnostic.php; then
            echo 'Forbidden VMware mutation method in Phase 5F' >&2
            exit 1
          fi
          if grep -REni '\b(INSERT|UPDATE|DELETE|REPLACE|ALTER|DROP|TRUNCATE)[[:space:]]' layers/phase5f; then
            echo 'Forbidden SQL mutation verb in Phase 5F' >&2
            exit 1
          fi
