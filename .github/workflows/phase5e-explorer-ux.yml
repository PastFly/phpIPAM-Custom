name: Phase 5E VMware Explorer UX Regression

on:
  push:
    branches:
      - phase5e/vmware-explorer-ux
  pull_request:
    branches:
      - phase5d/vmware-topology-details
    paths:
      - 'design/PHASE5E_VMWARE_EXPLORER_UX.md'
      - 'layers/phase5e/**'
      - 'layers/phase5e1/**'
      - 'tools/live-vmware-phase5e-ux-preflight.sh'
      - 'tools/live-vmware-phase5e1-feedback-preflight.sh'
      - 'installer/install-vmware-vcenter-phase5e-ux.sh'
      - 'installer/install-vmware-vcenter-phase5e1-feedback.sh'
      - 'installer/verify-vmware-vcenter-phase5e-ux.sh'
      - 'installer/verify-vmware-vcenter-phase5e1-feedback.sh'
      - 'tests/vmware-vcenter-phase5e-ux-regression.sh'
      - 'tests/vmware-vcenter-phase5e-installer-source-regression.sh'
      - 'tests/phpipam-address-link-resolver-regression.php'
      - '.github/workflows/phase5e-explorer-ux.yml'

permissions:
  contents: read

jobs:
  phase5e-ux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PHP CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-curl

      - name: Validate syntax
        run: |
          php -l layers/phase5e/app/integrations/index.php
          php -l layers/phase5e/app/integrations/registry.php
          php -l layers/phase5e/app/integrations/vmware/index.php
          php -l layers/phase5e/app/integrations/vmware/workspace-result.php
          php -l layers/phase5e/app/integrations/vmware/vm-card-result.php
          php -l layers/phase5e/functions/classes/class.IntegrationPhpIpamAddressLinkResolver.php
          php -l layers/phase5e1/app/sections/menu/menu-tools-admin.php
          php -l tests/phpipam-address-link-resolver-regression.php
          bash -n tools/live-vmware-phase5e-ux-preflight.sh
          bash -n tools/live-vmware-phase5e1-feedback-preflight.sh
          bash -n installer/install-vmware-vcenter-phase5e-ux.sh
          bash -n installer/install-vmware-vcenter-phase5e1-feedback.sh
          bash -n installer/verify-vmware-vcenter-phase5e-ux.sh
          bash -n installer/verify-vmware-vcenter-phase5e1-feedback.sh
          bash -n tests/vmware-vcenter-phase5e-ux-regression.sh
          bash -n tests/vmware-vcenter-phase5e-installer-source-regression.sh

      - name: Run Phase 5E UX/security regression
        run: bash tests/vmware-vcenter-phase5e-ux-regression.sh

      - name: Run phpIPAM address-link resolver regression
        run: php tests/phpipam-address-link-resolver-regression.php

      - name: Run Phase 5E deployment source-pin regression
        run: bash tests/vmware-vcenter-phase5e-installer-source-regression.sh

      - name: Re-run inherited Phase 5D model/UI regression
        run: |
          php tests/vmware-vcenter-explorer-model-regression.php
          php tests/vmware-vcenter-explorer-ui-regression.php
          bash tests/vmware-vcenter-phase5d-installer-source-regression.sh
