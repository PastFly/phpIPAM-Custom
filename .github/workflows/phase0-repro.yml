name: Reproducibility and Rack Regression

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - phase1/rack-regression-tests

permissions:
  contents: read

jobs:
  reproduce-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli

      - name: Validate test and installer syntax
        run: |
          bash -n installer/install-clean-v1.8.2.sh
          bash -n installer/verify.sh
          bash -n tests/reproduce-clean-v1.8.2.sh
          php -l tests/rack-free-u-regression.php

      - name: Reproduce from official phpIPAM 1.8.2 and run rack regressions
        run: bash tests/reproduce-clean-v1.8.2.sh
