name: Phase 5G Independent Inventory Core
on:
  push:
    branches: ['phase5g/**']
  pull_request:
    paths:
      - 'layers/phase5g/**'
      - 'tools/vmware-inventory-worker.php'
      - 'tests/phase5g-*'
      - 'design/phase5g-source-pins.json'
      - '.github/workflows/phase5g-inventory-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, posix, pcntl, curl, dom, mbstring
          coverage: none
      - name: Preserve accepted source and installer history
        run: |
          set -euo pipefail
          BASE=b6b1a697f16b22bc8d283ba4b4f59a889037255e
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --exit-code --diff-filter=DMRT "$BASE" HEAD -- layers tools installer
      - name: Syntax, exact dependency pins and HTTP guard ordering
        run: python3 -B tests/phase5g-contracts.test.py
      - name: Real encrypted persistence, restart and zero-network read model
        run: php tests/phase5g-inventory.test.php
      - name: Strict transport boundaries with stubbed network
        run: php tests/phase5g-source-adapter.test.php
      - name: Retained topology, storage correlation and encrypted cache
        run: |
          set -euo pipefail
          php tests/vmware-vcenter-topology-regression.php
          php tests/vmware-vcenter-datastore-regression.php
          php tests/vmware-vcenter-datastore-resolver-regression.php
          php tests/phase5f34-cache.test.php
          php tests/phase5f34-service.test.php
