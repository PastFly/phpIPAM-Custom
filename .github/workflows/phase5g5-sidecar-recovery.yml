name: Phase 5G Receipt-aware Recovery
on:
  push:
    branches: ['phase5g/**']
  pull_request:
    paths: ['tools/*phase5g5*', 'tools/live/phase5g5-*', 'tests/phase5g5-*', 'layers/phase5g5/**', '.github/workflows/phase5g5-sidecar-recovery.yml']
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, sodium, posix, pcntl, curl, mbstring
          coverage: none
      - name: Generated runtime, real storage and initial-priority behavior
        run: python3 -B tests/phase5g5-runtime-package.test.py
      - name: Parent-preserving seed, rollback, interruption and drift transactions
        run: sudo python3 -B tests/phase5g5-recovery-transaction.test.py
      - name: Retained provider, rendering and HTTP boundary tests
        run: |
          set -euo pipefail
          OUT=$(mktemp -d)
          python3 -B tools/build-phase5g5-collectors.py "$OUT"
          php tests/phase5g5-collectors.test.php "$OUT"
          php tests/phase5g5-provider-compat.test.php "$OUT/collectors"
          python3 -B tests/phase5g2-contracts.test.py
          php tests/phase5g3-telemetry.test.php
          php tests/phase5g4-readiness.test.php
      - name: Guard stale-host live hotfix boundary
        if: matrix.php == '8.4'
        run: |
          set -euo pipefail
          PATCH=b92ff9cf4fad29e8191d551577550a89a32cd48c
          git merge-base --is-ancestor "$PATCH" HEAD
          bash -n tools/live/phase5g5-stale-host-membership-hotfix.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/live/phase5g5-stale-host-membership-hotfix.sh').read_text()
          required=[
              "BASE='86751be5cde6cdd5e350d9ea50d1feaa2d3ef3ab'",
              "PATCH='b92ff9cf4fad29e8191d551577550a89a32cd48c'",
              "TARGET='/opt/phpipam-custom/inventory-recovery5g5/layers/phase5g/functions/classes/class.IntegrationVmwareInventorySource.php'",
              'PHASE5G5_STALE_HOST_CLEAN_CLONES_OK=1',
              'git clone --shared --no-checkout "$REPO" "$WORK/base"',
              'git clone --shared --no-checkout "$REPO" "$WORK/patch"',
              'test -z "$(git -C "$WORK/base" status --porcelain)"',
              'test -z "$(git -C "$WORK/patch" status --porcelain)"',
              'PYTHONDONTWRITEBYTECODE=1 python3 -B -',
              'test -z "$(git -C "$root" status --porcelain)"',
              'PHASE5G5_STALE_HOST_PATCH_WAIT=1',
              'PHASE5G5_STALE_HOST_PATCH_IDLE_WINDOW=1',
              'PHASE5G5_STALE_HOST_PATCH_TIMEOUT=5G5_BUSY',
              'PHASE5G5_STALE_HOST_LOCAL_TESTS_OK=1',
              'PHASE5G5_STALE_HOST_DATA_CHANGED=0',
              'PHASE5G5_STALE_HOST_SYSTEMD_CHANGED=0',
              'PHASE5G5_STALE_HOST_WEB_CHANGED=0',
              'cmp -s "$OLD" "$NEW"',
              'git hash-object "$TARGET"',
              'python3 -B tests/phase5g5-runtime-package.test.py',
          ]
          for value in required: assert value in p, value
          for forbidden in ['systemctl stop', 'systemctl disable', 'base64', '/var/www/html/', 'worktree add']:
              assert forbidden not in p, forbidden
          print('PHASE5G5_STALE_HOST_LIVE_BOUNDARY_OK')
          PY
