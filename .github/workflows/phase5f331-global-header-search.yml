name: Phase 5F.3.3.1 Native Global Search
on:
  push:
    branches: ["phase5f331/global-header-search"]
  pull_request:
    branches: ["phase5f33/vm-enriched-search"]
permissions:
  contents: read
jobs:
  global-search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: phpipam/phpipam
          ref: 6e11367e5f43eb9f50bde7f7b25bf65fc53d844d
          path: .upstream-test
          sparse-checkout: app/tools/search/index.php
          sparse-checkout-cone-mode: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and protected ancestor surface
        run: |
          find layers/phase5f331 -name '*.php' -exec php -l {} \;
          find layers/phase5f331 -name '*.js' -exec node --check {} \;
          bash -n tools/live-vmware-phase5f331-global-search-preflight.sh
          bash -n installer/install-vmware-vcenter-phase5f331-global-search.sh
          bash -n installer/verify-vmware-vcenter-phase5f331-global-search.sh
          python3 -m py_compile tools/phase5f331-global-search.py
          git diff --exit-code 056372227e2e00eb3001af52744f2d461cd751ba HEAD -- layers/phase5d layers/phase5e layers/phase5f layers/phase5f1 layers/phase5f2 layers/phase5f24 layers/phase5f25 layers/phase5f26 layers/phase5f3 layers/phase5f31 layers/phase5f32 layers/phase5f33
          git diff --exit-code 056372227e2e00eb3001af52744f2d461cd751ba HEAD -- installer/verify-vmware-vcenter-phase5f33-enriched-search.sh
      - name: PHP panel and inherited endpoint guards
        run: python3 tests/phase5f331-panel.test.py
      - name: Native patch, exact source, apply, verify and rollback simulation
        run: sudo env UPSTREAM_SEARCH="$GITHUB_WORKSPACE/.upstream-test/app/tools/search/index.php" python3 tests/phase5f331-deployment.test.py
      - name: Browser DOM regression dependencies
        run: npm install --prefix "$RUNNER_TEMP/phase5f331-node" jsdom@24.1.3 jquery@3.7.1 --ignore-scripts --no-audit --no-fund
      - name: Browser regression - search, pagination, errors, safe deeplinks
        run: NODE_PATH="$RUNNER_TEMP/phase5f331-node/node_modules" node tests/phase5f331-browser.test.js
