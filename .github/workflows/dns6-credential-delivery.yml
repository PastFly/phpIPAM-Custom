name: DNS6 job-bound credential delivery
on:
  pull_request:
    paths:
      - 'layers/dns6/**'
      - 'tests/dns6/**'
      - 'design/DNS6_CREDENTIAL_DELIVERY_SOURCE.md'
      - '.github/workflows/dns6-credential-delivery.yml'
permissions:
  contents: read
jobs:
  php-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install PHP CLI
        run: sudo apt-get update && sudo apt-get install -y php-cli php-sodium
      - name: DNS6 functional and source contracts
        run: |
          find layers/dns6 tests/dns6 -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/dns6/credential-context.test.php
          php tests/dns6/credential-delivery.test.php
          php tests/dns6/credential-http.test.php
          python3 tests/dns6/credential-source.test.py
