name: DNS8 one-shot E2E pilot source
on:
  pull_request:
    paths:
      - 'tools/live/dns-e2e-pilot-*.py'
      - 'tools/live/dns-e2e-one-shot-*.py'
      - 'collectors/windows/dns/Invoke-PhpIpamDnsE2EPilotOnce.ps1'
      - 'tests/dns8/**'
      - 'design/DNS8_E2E_PILOT.md'
      - '.github/workflows/dns8-e2e-pilot.yml'
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 tests/dns8/e2e-pilot-source.test.py
      - run: python3 tests/dns8/e2e-one-shot-source.test.py
      - run: python3 -m py_compile tools/live/dns-e2e-pilot-install.py tools/live/dns-e2e-pilot-cleanup.py tools/live/dns-e2e-one-shot-prepare.py tools/live/dns-e2e-one-shot-accept.py
