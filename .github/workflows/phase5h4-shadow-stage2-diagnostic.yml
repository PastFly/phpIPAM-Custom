name: Phase 5H Shadow Stage2 Diagnostic
on:
  push:
    branches: ['phase5h/shadow-stage2-diagnostic']
  pull_request:
    paths:
      - 'tools/phase5h4-shadow-stage2-diagnose.php'
      - 'tools/phase5h4-properties-fault-diagnose.php'
      - '.github/workflows/phase5h4-shadow-stage2-diagnostic.yml'
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, sodium, posix, pcntl, curl, mbstring
          coverage: none
      - name: Syntax, shared mutex and no-publication boundary
        run: |
          set -euo pipefail
          php -l tools/phase5h4-shadow-stage2-diagnose.php
          php -l tools/phase5h4-properties-fault-diagnose.php
          python3 - <<'PY'
          from pathlib import Path
          stage=Path('tools/phase5h4-shadow-stage2-diagnose.php').read_text()
          probe=Path('tools/phase5h4-properties-fault-diagnose.php').read_text()
          for text in [stage, probe]:
              for forbidden in ["->update('properties'", "->update('metrics'", "->publish('capabilities'", 'systemctl', '/var/www/html/app/']:
                  assert forbidden not in text, forbidden
              assert "const ACTIVE_WORKER_LOCK = '/var/lib/phpipam-custom/vmware-inventory-recovery5g5/connector-1/worker.lock';" in text
              assert 'IntegrationVmwareInventoryStore::noLinks(ACTIVE_WORKER_LOCK)' in text
              assert 'flock($productionLock, LOCK_EX | LOCK_NB)' in text
              assert 'flock($productionLock, LOCK_UN)' in text
          for required in [
              'PHASE5H_STAGE2_STAGE=', 'counter_registry', 'capability_provider_',
              'capability_availability_', 'metrics_batch_', "'shadow_written'=>false",
              'PHASE5H_STAGE2_LOCK_ACQUIRED=1', 'PHASE5H_STAGE2_LOCK_WAIT_MS='
          ]:
              assert required in stage, required
          assert stage.index('PHASE5H_STAGE2_LOCK_ACQUIRED=1') < stage.index("$current = $store->read('current')")
          assert stage.index("$current = $store->read('current')") < stage.index('new IntegrationVmwareBatchSession')
          for required in [
              'PHASE5H_PROPFAULT_BATCH=', 'PHASE5H_PROPFAULT_ERROR=',
              "'ManagedObjectNotFound' => 'managed_object_not_found'",
              "'InvalidProperty' => 'invalid_property'",
              "'InvalidArgument' => 'invalid_argument'",
              "'NotSupported' => 'not_supported'",
              "'MethodNotFound' => 'method_not_found'",
              "'InvalidType' => 'invalid_type'",
              "'shadow_written'=>false"
          ]:
              assert required in probe, required
          for forbidden in ['faultstring', 'textContent);', 'PHASE5H_PROPFAULT_ID=', 'PHASE5H_PROPFAULT_PROPERTY=']:
              assert forbidden not in probe, forbidden
          print('PHASE5H_STAGE2_DIAGNOSTIC_SHARED_MUTEX_SAFE_FAULT_CLASSIFIER_OK')
          PY
      - name: Retained batch and shadow planner regressions
        run: |
          set -euo pipefail
          php tests/phase5h-batch.test.php
          php tests/phase5h-counter-registry-duplicate.test.php
          php tests/phase5h4-shadow-planner.test.php
          php tests/phase5h4-shadow-cycle.test.php
